<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Story - 智能写作平台</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- 顶部标题栏 -->
  <header class="top-bar">
    <div class="top-brand">AI Story</div>
    <div class="top-actions">
      <button class="top-btn" id="backBtn" title="返回" style="display: none;">←</button>
      <button class="top-btn" id="settingsBtn" title="设置">⚙</button>
    </div>
  </header>

  <div class="main-container">
    <!-- 左侧导航 -->
    <aside class="left-nav" id="leftNav">
      <div class="nav-header">
        <span class="nav-title">目录</span>
      </div>
      <div class="nav-content" id="navContent"></div>
    </aside>

    <!-- 右侧内容区 -->
    <main class="content-area" id="contentArea">
      <!-- 编辑区域 -->
      <div class="editor-section" id="editorSection">
        <div class="editor-content" id="editorContent">
          <div class="welcome-message">
            <h1>欢迎使用 AI Story</h1>
            <p>从左侧选择分类开始创作</p>
          </div>
        </div>
      </div>

      <!-- 设置区域 -->
      <div class="settings-section" id="settingsSection" style="display: none;">
        <div class="settings-header">
          <h3>导航设置</h3>
        </div>
        <div class="settings-two-column">
          <!-- 一级导航列 -->
          <div class="settings-column">
            <div class="column-header">
              <h4>一级导航</h4>
              <button class="btn-add" id="addLevel1Btn" title="添加">+</button>
            </div>
            <div class="column-list" id="level1List"></div>
          </div>

          <!-- 二级导航列 -->
          <div class="settings-column">
            <div class="column-header">
              <h4 id="level2Title">二级导航</h4>
              <button class="btn-add" id="addLevel2Btn" title="添加" style="display: none;">+</button>
            </div>
            <div class="column-list" id="level2List"></div>
          </div>
        </div>

        <div class="settings-divider"></div>

        <div class="settings-header">
          <h3>API 配置</h3>
          <button class="btn btn-primary btn-sm" id="addApiBtn">+ 添加配置</button>
        </div>
        <div class="api-list" id="apiList"></div>
      </div>
    </main>
  </div>

  <!-- 设置按钮（右下角悬浮） -->
  <button class="settings-fab" id="settingsBtnFloat" title="设置">⚙</button>

  <!-- 模态框 -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">标题</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/settings-page.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
